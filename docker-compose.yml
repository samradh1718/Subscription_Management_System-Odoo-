name: brightloop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brightloop}
      POSTGRES_DB: brightloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop -d brightloop"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "127.0.0.1:8025:8025"  # web inbox
      - "127.0.0.1:1025:1025"  # SMTP

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://brightloop:${POSTGRES_PASSWORD:-brightloop}@postgres:5432/brightloop
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PUBLIC_APP_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
